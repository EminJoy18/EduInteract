{% extends 'index.html' %}
{% block content %}
<head>
    <!-- <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet"> -->
    <link href="https://cdn.quilljs.com/2.0.0-dev.3/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/2.0.0-dev.3/quill.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
</head>
<body>
<div class="main-section for-question_paper">
    <br><br>
    <form method="POST" action="{% url 'generate_lesson_plan' %}">
        {% csrf_token %}
        <label for="subject">Subject &nbsp;</label>
        <select class="input-field" id="subject" name="subject" required>
            <option value="">Select Subject</option>
            {% for course in courses %}
                <option value="{{ course.CourseID }}">{{ course.Course_Name }}</option>
            {% endfor %}
        </select>
        <br><br>
        <label for="course_id">Start Date  </label>
        <input class="input-field" type="date" id="start_date" name="start_date" required>
        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        <label for="course_name">End Date  </label>
        <input class="input-field" type="date" id="end_date" name="end_date" required>
        <br><br>
        <button class="submit-button" type="submit">Generate</button>
    </form>    
    <br>
    <button class="submit-button" id="download" style="margin-left: 850px;">Download as PDF</button>
    <br><br>
    <div id="editor" style="width:1000px; height: 400px; border: 1px solid #ccc; padding: 10px;"></div>
</div>
<script>
    // Initialize Quill editor
    var quill = new Quill('#editor', {
        theme: 'snow',
        // readOnly: true,
        modules: {
            table: true,
            toolbar: false
        }
    });

    // Load content into Quill editor
    var quillContent = `{{ quill_content|safe }}`;
    quill.clipboard.dangerouslyPasteHTML(quillContent);

    // Function to download the entire Quill editor content as a PDF
    document.getElementById('download').addEventListener('click', function() {
        // Create a temporary container to hold the Quill content as plain HTML
        const tempContainer = document.createElement('div');
        tempContainer.innerHTML = quill.root.innerHTML;
        tempContainer.style.width = '1000px';
        tempContainer.style.padding = '10px';
        tempContainer.style.border = '1px solid #ccc';

        // Use html2pdf to generate the PDF from the temporary container
        const options = {
            margin: 10,
            filename: 'lesson_plan.pdf',
            html2canvas: { scale: 2, useCORS: true },
            jsPDF: { format: 'a4', orientation: 'portrait' }
        };

        html2pdf().from(tempContainer).set(options).save();
    });
</script>
</body>
{% endblock %}
